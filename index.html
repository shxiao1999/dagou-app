      document.getElementById('todoViewDropdown').classList.remove('show');
    }

    function setTodoViewMode(mode) {
      const prevMode = todoViewMode;
      todoViewMode = mode;
      if (mode === 'day' && (prevMode === 'week' || prevMode === 'month')) {
        todoViewDate = new Date();
        todoViewDate.setHours(0, 0, 0, 0);
      }
      closeTodoViewDropdown();
      renderTodos();
    }

    function openTodoSheet() {
      todoInput.value = '';
      todoNoteInput.value = '';
      todoColorPickerInst.syncFromColor(TODO_DEFAULT_COLOR);
      document.getElementById('todoOverlay').classList.add('show');
      document.getElementById('todoSheet').classList.add('show');
      setTimeout(() => todoInput.focus(), 300);
    }

    function closeTodoSheet() {
      todoColorPickerInst.closePanel();
      document.getElementById('todoOverlay').classList.remove('show');
      document.getElementById('todoSheet').classList.remove('show');
    }

    function shiftTodoView(step) {
      if (todoViewMode === 'day') {
        todoViewDate.setDate(todoViewDate.getDate() + step);
      } else if (todoViewMode === 'week') {
        todoViewDate.setDate(todoViewDate.getDate() + step * 7);
      } else {
        todoViewDate.setMonth(todoViewDate.getMonth() + step);
      }
      renderTodos();
    }

    function goToTodoDay(dateStr) {
      todoViewDate = parseDateStr(dateStr);
      todoViewMode = 'day';
      renderTodos();
    }

    document.getElementById('btnAddTodo').addEventListener('click', openTodoSheet);
    document.getElementById('btnCancelTodo').addEventListener('click', closeTodoSheet);
    document.getElementById('todoOverlay').addEventListener('click', closeTodoSheet);
    document.getElementById('btnConfirmTodo').addEventListener('click', addTodo);
    document.getElementById('btnTodoPrev').addEventListener('click', () => shiftTodoView(-1));
    document.getElementById('btnTodoNext').addEventListener('click', () => shiftTodoView(1));
    document.getElementById('btnTodoViewMode').addEventListener('click', e => {
      e.stopPropagation();
      document.getElementById('todoViewDropdown').classList.toggle('show');
    });
    document.querySelectorAll('[data-todo-view]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        setTodoViewMode(btn.dataset.todoView);
      });
    });
    document.addEventListener('click', closeTodoViewDropdown);

    todoInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    function addTodo() {
      const text = todoInput.value.trim();
      const note = todoNoteInput.value.trim();
      if (!text) return;
      const maxOrder = state.todos.reduce((max, t) => Math.max(max, t.order), -1);
      const todo = {
        id: uid(),
        text,
        completed: false,
        progress: 0,
        order: maxOrder + 1,
        scheduledDate: formatDate(new Date())
      };
      if (note) todo.note = note;
      todo.color = todoColorPickerInst.getColor();
      state.todos.push(todo);
      saveState();
      closeTodoSheet();
      renderTodos();
    }

    function toggleTodo(id) {
      const todo = state.todos.find(t => t.id === id);
      if (!todo) return;
      if (todo.completed) markTodoIncomplete(todo);
      else markTodoCompleted(todo);
      saveState();
      renderTodos();
    }

    function deleteTodo(id) {
      showConfirm(t('confirmDeleteTodo'), () => {
        state.todos = state.todos.filter(t => t.id !== id);
        saveState();
        renderTodos();
      });
    }

    function snapTodoProgress(pct) {
      const step = 100 / TODO_PROGRESS_SEGMENTS;
      const snapped = Math.round(pct / step) * step;
      return Math.max(0, Math.min(100, snapped));
    }

    function setTodoProgress(id, progress) {
      const todo = state.todos.find(t => t.id === id);
      if (!todo || todo.completed) return;
      todo.progress = snapTodoProgress(progress);
      if (todo.progress >= 100) markTodoCompleted(todo);
      saveState();
      renderTodos();
    }

    function reorderTodos(fromId, toId, position) {
      const viewDateStr = formatDate(todoViewDate);
      const incomplete = getIncompleteForDate(viewDateStr);
      const fromIdx = incomplete.findIndex(t => t.id === fromId);
      let toIdx = incomplete.findIndex(t => t.id === toId);
      if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return;

      const [moved] = incomplete.splice(fromIdx, 1);
      if (fromIdx < toIdx) toIdx--;
      const insertIdx = position === 'bottom' ? toIdx + 1 : toIdx;
      incomplete.splice(insertIdx, 0, moved);
      incomplete.forEach((t, i) => { t.order = i; });

      saveState();
      renderTodos();
    }

    function renderTodoDateNav() {
      const main = document.getElementById('todoDateMain');
      const sub = document.getElementById('todoDateSub');
      if (todoViewMode === 'day') {
        main.textContent = formatDisplayDate(todoViewDate);
        sub.textContent = isToday(todoViewDate) ? t('today') : '';
      } else if (todoViewMode === 'week') {
        const start = getWeekStart(todoViewDate);
        const end = addDays(start, 6);
        main.textContent = formatDateRange(start, end);
        sub.textContent = t('thisWeek');
      } else {
        main.textContent = formatMonthYear(todoViewDate.getFullYear(), todoViewDate.getMonth() + 1);
        sub.textContent = t('thisMonth');
      }
    }

    function renderTodoDayView() {
      const viewDateStr = formatDate(todoViewDate);
      const incomplete = getIncompleteForDate(viewDateStr);
      const completed = getCompletedForDate(viewDateStr);

      document.getElementById('incompleteCount').textContent = incomplete.length;
      document.getElementById('completedCount').textContent = completed.length;

      const incompleteList = document.getElementById('incompleteList');
      const completedList = document.getElementById('completedList');
      incompleteList.innerHTML = '';
      completedList.innerHTML = '';

      const emptyMsg = getTodoEmptyMessages(viewDateStr);
      const incompleteEmpty = document.getElementById('incompleteEmpty');
      const completedEmpty = document.getElementById('completedEmpty');
      incompleteEmpty.textContent = emptyMsg.incomplete;
      completedEmpty.textContent = emptyMsg.completed;
      incompleteEmpty.style.display = incomplete.length ? 'none' : 'block';
      completedEmpty.style.display = completed.length ? 'none' : 'block';

      incomplete.forEach(todo => {
        incompleteList.appendChild(createTodoElement(todo, false, viewDateStr));
      });

      completed.forEach(todo => {
        completedList.appendChild(createTodoElement(todo, true, viewDateStr));
      });

      const isPastDay = viewDateStr < formatDate(new Date());
      const dayView = document.getElementById('todoDayView');
      const incompleteSection = document.getElementById('todoIncompleteSection');
      const completedSection = document.getElementById('todoCompletedSection');
      if (isPastDay) {
        dayView.insertBefore(completedSection, incompleteSection);
      } else {
        dayView.insertBefore(incompleteSection, completedSection);
      }
    }

    function renderTodoWeekView() {
      const grid = document.getElementById('todoWeekGrid');
      grid.innerHTML = '';
      const start = getWeekStart(todoViewDate);

      for (let i = 0; i < 7; i++) {
        const day = addDays(start, i);
        const dateStr = formatDate(day);
        const completed = getCompletedForDate(dateStr);
        const card = document.createElement('div');
        card.className = 'todo-week-day';
        card.innerHTML = `
          <div class="todo-week-day-head">
            <div class="todo-week-day-label${isToday(day) ? ' today' : ''}">${getWeekdayName(day.getDay())} ${day.getMonth() + 1}/${day.getDate()}</div>
            <div class="todo-week-day-count">${completed.length ? t('completedItems', { n: completed.length }) : ''}</div>
          </div>
          <div class="todo-week-day-items">
            ${completed.length
              ? completed.slice(0, 4).map(t => `<div class="todo-week-day-item">✓ ${escapeHtml(t.text)}</div>`).join('')
              : `<div class="todo-week-day-empty">${t('noCompleted')}</div>`
            }
            ${completed.length > 4 ? `<div class="todo-week-day-item">还有 ${completed.length - 4} 项...</div>` : ''}
          </div>
        `;
        card.addEventListener('click', () => goToTodoDay(dateStr));
        grid.appendChild(card);
      }
    }

    function renderTodoMonthView() {
      const y = todoViewDate.getFullYear();
      const m = todoViewDate.getMonth();
      document.getElementById('todoMonthTitle').textContent = formatMonthYear(y, m + 1);
      const grid = document.getElementById('todoMonthGrid');
      grid.innerHTML = '';

      const firstDay = new Date(y, m, 1);
      const startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const prevMonthDays = new Date(y, m, 0).getDate();

      for (let i = 0; i < startOffset; i++) {
        const dayNum = prevMonthDays - startOffset + i + 1;
        grid.appendChild(createTodoMonthDayCell(y, m - 1, dayNum, true));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        grid.appendChild(createTodoMonthDayCell(y, m, d, false));
      }

      const totalCells = startOffset + daysInMonth;
      const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let i = 1; i <= remaining; i++) {
        grid.appendChild(createTodoMonthDayCell(y, m + 1, i, true));
      }
    }

    function createTodoMonthDayCell(year, month, day, otherMonth) {
      const date = new Date(year, month, day);
      const dateStr = formatDate(date);
      const completed = getCompletedForDate(dateStr);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'todo-month-day' + (otherMonth ? ' other-month' : '') + (isToday(date) ? ' today' : '');
      btn.innerHTML = `
        <span class="todo-month-day-num">${day}</span>
        ${completed.length ? `<span class="todo-month-day-count">${t('monthItems', { n: completed.length })}</span>` : ''}
        ${completed.length ? '<span class="todo-month-day-dot"></span>' : ''}
      `;
      if (!otherMonth) {
        btn.addEventListener('click', () => goToTodoDay(dateStr));
      }
      return btn;
    }

    function renderTodos() {
      renderTodoDateNav();
      updateTodoViewMenu();
      document.getElementById('todoDayView').style.display = todoViewMode === 'day' ? 'block' : 'none';
      document.getElementById('todoWeekView').style.display = todoViewMode === 'week' ? 'block' : 'none';
      document.getElementById('todoMonthView').style.display = todoViewMode === 'month' ? 'block' : 'none';
      if (todoViewMode === 'day') renderTodoDayView();
      else if (todoViewMode === 'week') renderTodoWeekView();
      else renderTodoMonthView();
    }

    function createTodoElement(todo, isCompleted, viewDateStr) {
      const item = document.createElement('div');
      const carriedOver = !isCompleted && viewDateStr && isCarriedOverTodo(todo, viewDateStr);
      const isFrozen = !isCompleted && viewDateStr && isFrozenTodoRecord(todo, viewDateStr);
      item.className = 'todo-item' + (isCompleted ? ' completed' : '') + (isFrozen ? ' frozen' : '');
      item.dataset.id = todo.id;

      if (isFrozen) {
        const progress = snapTodoProgress(todo.progress);
        item.innerHTML = `
          <div class="todo-item-main">
            <div class="todo-record-content">
              ${carriedOver ? `<span class="todo-from-badge">${t('from')} ${formatShortDate(todo.scheduledDate)}</span>` : ''}
              <div class="todo-text-highlight" style="--progress:${progress}%;${getTodoHighlightStyle(todo)}"><span class="todo-text">${escapeHtml(todo.text)}</span></div>
              ${todo.note ? `<span class="todo-note">${escapeHtml(todo.note)}</span>` : ''}
            </div>
          </div>
        `;
        return item;
      }

      item.innerHTML = `
        <div class="todo-item-main">
          ${!isCompleted ? '<span class="todo-drag-handle" title="拖动排序">⠿</span>' : ''}
          <div class="todo-checkbox ${isCompleted ? 'checked' : ''}" data-action="toggle"></div>
          ${isCompleted
            ? `<div class="todo-completed-content">
                <span class="todo-text">${escapeHtml(todo.text)}</span>
                ${todo.note ? `<span class="todo-note">${escapeHtml(todo.note)}</span>` : ''}
                ${todo.completedAt ? `<span class="todo-completed-time">${formatCompletedTime(todo.completedAt)}</span>` : ''}
              </div>`
            : `<div class="todo-incomplete-content">
                <div class="todo-text-highlight" data-action="progress" style="--progress:${todo.progress}%;${getTodoHighlightStyle(todo)}">
                  <span class="todo-text-inner">
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    ${carriedOver ? `<span class="todo-from-inline">${t('from')} ${formatShortDate(todo.scheduledDate)}</span>` : ''}
                  </span>
                </div>
                ${todo.note ? `<span class="todo-note">${escapeHtml(todo.note)}</span>` : ''}
              </div>`
          }
          <button class="todo-delete" data-action="delete" title="删除">×</button>
        </div>
      `;

      item.querySelector('[data-action="toggle"]').addEventListener('click', () => toggleTodo(todo.id));
      item.querySelector('[data-action="delete"]').addEventListener('click', () => deleteTodo(todo.id));

      if (!isCompleted) {
        const highlight = item.querySelector('[data-action="progress"]');
        initHighlightDrag(highlight, todo.id);

        const handle = item.querySelector('.todo-drag-handle');
        initDragReorder(item, handle, todo.id);
      }

      return item;
    }

    function initHighlightDrag(el, todoId) {
      let dragging = false;

      function update(e) {
        const rect = el.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const pct = ((clientX - rect.left) / rect.width) * 100;
        const val = snapTodoProgress(pct);
        el.style.setProperty('--progress', val + '%');
        el._currentProgress = val;
      }

      function start(e) {
        dragging = true;
        e.preventDefault();
        update(e);
      }

      function move(e) {
        if (!dragging) return;
        e.preventDefault();
        update(e);
      }

      function end() {
        if (!dragging) return;
        dragging = false;
        if (el._currentProgress !== undefined) {
          setTodoProgress(todoId, el._currentProgress);
        }
      }

      el.addEventListener('mousedown', start);
      el.addEventListener('touchstart', start, { passive: false });
      document.addEventListener('mousemove', move);
      document.addEventListener('touchmove', move, { passive: false });
      document.addEventListener('mouseup', end);
      document.addEventListener('touchend', end);
    }

    function initDragReorder(item, handle, todoId) {
      handle.addEventListener('mousedown', e => startReorder(e, todoId, item));
      handle.addEventListener('touchstart', e => startReorder(e, todoId, item), { passive: false });
    }

    function startReorder(e, todoId, sourceItem) {
      e.preventDefault();
      dragTodoId = todoId;
      sourceItem.classList.add('dragging');

      function onMove(ev) {
        ev.preventDefault();
        const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
        document.querySelectorAll('.todo-item').forEach(el => {
          el.classList.remove('drag-over-top', 'drag-over-bottom');
        });

        const target = document.elementFromPoint(
          ev.touches ? ev.touches[0].clientX : ev.clientX,
          clientY
        );
        const targetItem = target?.closest('.todo-item');
        if (targetItem && targetItem.dataset.id !== dragTodoId && !targetItem.classList.contains('completed')) {
          const rect = targetItem.getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          dragOverTodoId = targetItem.dataset.id;
          dragOverPosition = clientY < mid ? 'top' : 'bottom';
          targetItem.classList.add(dragOverPosition === 'top' ? 'drag-over-top' : 'drag-over-bottom');
        } else {
          dragOverTodoId = null;
        }
      }

      function onEnd() {
        sourceItem.classList.remove('dragging');
        document.querySelectorAll('.todo-item').forEach(el => {
          el.classList.remove('drag-over-top', 'drag-over-bottom');
        });

        if (dragTodoId && dragOverTodoId) {
          reorderTodos(dragTodoId, dragOverTodoId, dragOverPosition);
        }

        dragTodoId = null;
        dragOverTodoId = null;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchend', onEnd);
      }

      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);
    }

    function updateStatusBarTime() {
      const now = new Date();
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('statusBarTime').textContent = `${h}:${m}`;
    }

    // Init
    initSettings();
    initScheduleColorPicker();
    initTodoColorPicker();
    document.addEventListener('click', (e) => {
      colorPickerInstances.forEach(picker => {
        if (!picker.open) return;
        if (e.target.closest('#' + picker.wrapId)) return;
        picker.closePanel();
      });
    });
    applyI18n();
    updateStatusBarTime();
    setInterval(updateStatusBarTime, 1000);
    renderSchedule();
    renderTodos();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
